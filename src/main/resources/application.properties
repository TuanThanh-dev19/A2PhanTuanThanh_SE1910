spring.application.name=A2PhanTuanThanh_SE1910

spring.datasource.url=jdbc:sqlserver://${SQLSERVER_HOST}:${SQLSERVER_PORT:1433};databaseName=A2PhanTuanThanh_SE1910;encrypt=${SQLSERVER_ENCRYPT:true};trustServerCertificate=${SQLSERVER_TRUST_SERVER_CERTIFICATE:false};integratedSecurity=${SQLSERVER_INTEGRATED_SECURITY:false};applicationName=A2PhanTuanThanh_SE1910;loginTimeout=10
spring.datasource.username=${SQLSERVER_USERNAME:sa}
spring.datasource.password=${SQLSERVER_PASSWORD:tuanthanh1199}

# DEC-03: create missing tables/constraints without resetting existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
# DDL constraints are declared explicitly in mappings; Bean Validation still runs on writes.
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.open-in-view=false

# HS256 key: Base64 of at least 32 random bytes; required, never stored in Git.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=A2PhanTuanThanh_SE1910
app.jwt.lifetime=PT1H
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Opt-in demo data; only inserts missing demo records, never resets existing data.
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin.m3@example.com}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.staff-email=${DEMO_STAFF_EMAIL:staff.m3@example.com}
app.demo.staff-password=${DEMO_STAFF_PASSWORD:}
